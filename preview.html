<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tell Me Everything</title>
  <meta name="description" content="Tell Me Everything — a podcast interviewing 100 people in Silicon Valley. One polaroid per episode." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
  <style>
/* ------------------------------------------------------------------
   Tell Me Everything
   Swap the title font in one place: --type (and the <link> in index.html)
------------------------------------------------------------------- */
:root {
  --type: "Special Elite", "Courier New", Courier, monospace;
  --ink: #2e2e2e;
  --wall: #f6f3ee;
  --frame-blue: #2d86c9;
  --frame-pale: #a9d1e2;

  --card-w: clamp(130px, min(16vw, 28vh), 220px);
  --card-h: calc(var(--card-w) * 107 / 88); /* polaroid 600 proportions */
  --cam-w: calc(var(--card-w) * 1.95);

  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-soft: cubic-bezier(.4, .1, .2, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
}

body {
  font-family: var(--type);
  color: var(--ink);
  background-color: var(--wall);
  /* the cold-press paper wall from the Figma file, mirrored into a seamless tile */
  background-image:
    radial-gradient(140% 110% at 50% 45%, rgba(0, 0, 0, 0) 60%, rgba(60, 50, 40, .08) 100%),
    url("img/wall.jpg");
  background-size: 100% 100%, 2880px 1088px;
  -webkit-font-smoothing: antialiased;
}

/* ------------------------------------------------------------------ title */
#title {
  position: fixed;
  left: 50%;
  top: 30%;
  width: min(86vw, 760px);
  margin: 0;
  transform: translate(-50%, -50%);
  transition: top 1.4s var(--ease-soft), width 1.4s var(--ease-soft);
  z-index: 5;
  pointer-events: none;
}
#title-svg { display: block; width: 100%; height: auto; overflow: visible; }
#title-svg text {
  font-family: var(--type);
  font-weight: 400;
  font-size: 100px;
}
#title-svg .measure { fill: transparent; }
#title-svg .letter {
  fill: var(--ink);
  fill-opacity: 0;
  stroke: var(--ink);
  stroke-width: 1.1;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 900;
  stroke-dashoffset: 900;
  animation-name: draw, ink;
  animation-duration: 1.15s, .7s;
  animation-timing-function: cubic-bezier(.55, .08, .3, 1), ease-out;
  animation-delay: var(--d), calc(var(--d) + .42s);
  animation-fill-mode: forwards;
}
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes ink  { to { fill-opacity: .96; } }

.stage-shot #title,
.stage-wall #title {
  top: 12%;
  width: min(50vw, 360px);
}

/* ------------------------------------------------------------------ camera */
#camera-wrap {
  position: fixed;
  left: 50%;
  bottom: max(4vh, 24px);
  width: var(--cam-w);
  aspect-ratio: 320 / 270;
  transform: translate(-50%, 115%);
  opacity: 0;
  transition: transform 1.5s var(--ease-out), opacity 1s ease;
  z-index: 6;
}
.stage-ready #camera-wrap,
.stage-shot #camera-wrap {
  transform: translate(-50%, 0);
  opacity: 1;
}
.stage-wall #camera-wrap {
  transform: translate(-50%, 52%) scale(.78);
  transform-origin: 50% 100%;
  opacity: 1;
  transition: transform 1.6s var(--ease-soft);
}
.stage-wall #camera-wrap:hover { transform: translate(-50%, 44%) scale(.78); transition-duration: .6s; }

#camera {
  all: unset;
  position: relative;
  display: block;
  width: 100%;
  height: 100%;
  cursor: pointer;
  z-index: 2;
  transition: transform .5s var(--ease-out);
  -webkit-tap-highlight-color: transparent;
}
#camera svg {
  width: 100%;
  height: 100%;
  display: block;
  overflow: visible;
  filter: drop-shadow(0 2px 2px rgba(30, 40, 60, .18)) drop-shadow(0 22px 26px rgba(30, 40, 60, .22));
}
.stage-ready #camera:hover { transform: translateY(-6px) rotate(-.6deg); }
#camera:focus-visible { outline: 2px dashed var(--ink); outline-offset: 10px; border-radius: 24px; }
#camera.press { transform: translateY(2px) scale(.985); transition-duration: .09s; }
#camera .cap { transition: transform .09s ease; transform-origin: 276px 145px; }
#camera.press .cap { transform: scale(.88) translateY(1px); }

/* the print rises out of the top slot */
.slot-mask {
  position: absolute;
  left: 50%;
  bottom: calc(100% * 252 / 270); /* slot line, from the svg */
  width: calc(var(--card-w) + 40px);
  height: calc(var(--card-h) + 40px);
  transform: translateX(-50%);
  overflow: hidden;
  pointer-events: none;
  z-index: 1;
}
#print {
  position: absolute;
  left: 20px;
  bottom: 0;
  width: var(--card-w);
  height: var(--card-h);
  transform: translateY(102%);
}
#print.ejecting {
  transform: translateY(0);
  transition: transform 1.55s cubic-bezier(.45, .05, .55, .95);
}
#print .card { box-shadow: 0 1px 0 rgba(0, 0, 0, .08); }
#print .tape { opacity: 0; }
.flyer .tape { animation: tape-on .5s ease 1.2s both; }
@keyframes tape-on { from { opacity: 0; transform: translateX(-50%) rotate(var(--tape)) translateY(-6px); } }

/* ------------------------------------------------------------------ hint */
#hint {
  position: absolute;
  left: calc(100% * 276 / 320);
  top: calc(100% * 145 / 270);
  width: 0;
  height: 0;
  z-index: 3;
  opacity: 0;
  pointer-events: none;
  transition: opacity .8s ease;
}
.stage-ready.show-hint #hint { opacity: 1; }
#hint .ring {
  position: absolute;
  left: 0; top: 0;
  width: calc(var(--cam-w) * .12);
  aspect-ratio: 1;
  border: 2px solid rgba(255, 255, 255, .95);
  border-radius: 50%;
  transform: translate(-50%, -50%) scale(.6);
  opacity: 0;
  animation: pulse 2.2s var(--ease-out) infinite;
  box-shadow: 0 0 0 1px rgba(31, 47, 86, .12);
}
#hint .r2 { animation-delay: 1.1s; }
@keyframes pulse {
  0%   { transform: translate(-50%, -50%) scale(.7); opacity: 0; }
  15%  { opacity: .95; }
  100% { transform: translate(-50%, -50%) scale(2.1); opacity: 0; }
}
#hint .hand {
  position: absolute;
  left: 4px;
  top: 6px;
  width: max(34px, calc(var(--cam-w) * .19));
  transform-origin: 30% 10%;
  filter: drop-shadow(0 4px 6px rgba(20, 30, 50, .25));
  animation: tap 2.2s var(--ease-soft) infinite;
}
@keyframes tap {
  0%, 100% { transform: translate(14px, 16px) rotate(-28deg); }
  42%      { transform: translate(14px, 16px) rotate(-28deg); }
  55%      { transform: translate(4px, 4px) rotate(-28deg) scale(.94); }
  68%      { transform: translate(14px, 16px) rotate(-28deg); }
}

/* ------------------------------------------------------------------ flash */
#flash {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle at 50% 70%, #fff 0%, #f6fbff 60%, #e9f3fb 100%);
  opacity: 0;
  pointer-events: none;
  z-index: 20;
}

/* ------------------------------------------------------------------ wall / carousel */
#wall {
  position: fixed;
  left: 0;
  right: 0;
  top: 53%;
  height: calc(var(--card-h) + 140px);
  transform: translateY(-50%);
  overflow: hidden;
  pointer-events: none;
  z-index: 4;
}
.stage-wall #wall { pointer-events: auto; cursor: grab; touch-action: none; }
#wall.dragging { cursor: grabbing; }
#wall.dragging .slot { pointer-events: none; }
#track {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  display: flex;
  align-items: center;
  gap: calc(var(--card-w) * .2);
  padding-left: calc(var(--card-w) * .16);
  will-change: transform;
}

.slot {
  position: relative;
  flex: 0 0 auto;
  width: var(--card-w);
  height: var(--card-h);
  transform: translateY(var(--y, 0));
}
.slot .card {
  transform: rotate(var(--tilt, 0deg));
  transition: transform .9s var(--ease-out), box-shadow .9s var(--ease-out), opacity .7s ease;
}
/* before a card is pressed onto the wall */
.slot.pending .card {
  opacity: 0;
  transform: translateY(-18px) rotate(calc(var(--tilt) * 1.6)) scale(1.1);
  box-shadow: 0 30px 40px -12px rgba(30, 40, 60, .3);
}
.slot.hidden .card { visibility: hidden; transition: none; }
.slot:hover { z-index: 3; }
.slot:hover .card {
  transform: translateY(-10px) rotate(0deg) scale(1.06);
  box-shadow:
    0 1px 1px rgba(20, 30, 50, .1),
    0 26px 36px -14px rgba(20, 30, 50, .38);
  transition-duration: .7s;
}

/* ------------------------------------------------------------------ polaroid */
.card {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  padding: calc(var(--card-w) * 5 / 88) calc(var(--card-w) * 5 / 88) 0;
  background: var(--frame, var(--frame-pale));
  border-radius: 1.5px;
  box-shadow:
    0 1px 1px rgba(30, 40, 55, .16),
    0 10px 18px -8px rgba(30, 40, 55, .28);
  cursor: inherit;
}
.card::before { /* the frame's printed grain and lighter chin */
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background:
    linear-gradient(180deg, rgba(255, 255, 255, 0) 78%, rgba(255, 255, 255, .14) 80%, rgba(255, 255, 255, .1) 100%),
    url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='.5'/></svg>");
  mix-blend-mode: soft-light;
  pointer-events: none;
}
.card::after { /* paper sheen + edge */
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .35), inset 0 -1px 0 rgba(20, 40, 70, .08);
  pointer-events: none;
}
.photo {
  position: relative;
  width: 100%;
  aspect-ratio: 1;
  overflow: hidden;
  background: #dbe9f3;
  box-shadow: inset 0 0 0 1px rgba(10, 30, 60, .12);
}
.photo svg, .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
.photo::before { /* film grain */
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='g'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23g)' opacity='.55'/></svg>");
  mix-blend-mode: overlay;
  opacity: .5;
  pointer-events: none;
}
.photo::after { /* lens vignette */
  content: "";
  position: absolute;
  inset: 0;
  z-index: 2;
  background: radial-gradient(120% 100% at 50% 45%, transparent 65%, rgba(10, 25, 50, .18) 100%);
  pointer-events: none;
}
.develop {
  position: absolute;
  inset: 0;
  z-index: 3;
  background: linear-gradient(180deg, #2e3b45, #3a4652);
  opacity: 0;
  pointer-events: none;
}
.undeveloped .develop { opacity: 1; }
.developing .develop { opacity: 0; transition: opacity 3.6s cubic-bezier(.5, 0, .3, 1); }

.caption {
  position: absolute;
  left: 0; right: 0;
  bottom: 0;
  height: calc(var(--card-h) - var(--card-w) * 4 / 54 - (var(--card-w) * 46 / 54) * 62 / 46);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--type);
  font-weight: 500;
  font-size: calc(var(--card-w) * .12);
  color: rgba(31, 47, 86, .78);
  letter-spacing: .02em;
}

.poem {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 0 12%;
  background:
    repeating-linear-gradient(180deg, transparent 0 calc(var(--card-w) * .13 - 1px), rgba(45, 134, 201, .16) calc(var(--card-w) * .13 - 1px) calc(var(--card-w) * .13)),
    linear-gradient(170deg, #fbfaf7, #efece6);
  font-family: var(--type);
  font-size: calc(var(--card-w) * .075);
  line-height: calc(var(--card-w) * .13);
  color: var(--ink);
}
.poem span { display: block; }
.poem span:nth-child(2) { padding-left: 10%; }
.poem span:nth-child(3) { padding-left: 4%; }

.tape {
  position: absolute;
  left: 50%;
  top: calc(var(--card-w) * -.07);
  width: 40%;
  height: calc(var(--card-w) * .13);
  transform: translateX(-50%) rotate(var(--tape, -3deg));
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, .0) 0 6px, rgba(255, 255, 255, .12) 6px 7px),
    rgba(232, 242, 250, .62);
  box-shadow: 0 1px 2px rgba(20, 30, 50, .12);
  clip-path: polygon(2% 0, 98% 4%, 100% 30%, 97% 55%, 100% 82%, 97% 100%, 3% 96%, 0 70%, 3% 45%, 0 18%);
  backdrop-filter: blur(.5px);
  z-index: 4;
}

/* ------------------------------------------------------------------ small screens */
@media (max-width: 600px) {
  :root { --card-w: clamp(130px, 44vw, 190px); --cam-w: min(calc(var(--card-w) * 1.95), 82vw); }
  .stage-shot #title, .stage-wall #title { width: 60vw; top: 10%; }
}

@media (prefers-reduced-motion: reduce) {
  #title-svg .letter { animation-duration: .01s, .01s; animation-delay: 0s, 0s; }
  #hint .ring, #hint .hand { animation: none; }
}

</style>
</head>
<body class="stage-intro">
  <h1 id="title" aria-label="Tell Me Everything">
    <svg id="title-svg" role="presentation" aria-hidden="true"></svg>
  </h1>

  <section id="wall" aria-label="Episodes">
    <div id="track"></div>
  </section>

  <div id="camera-wrap">
    <div class="slot-mask" aria-hidden="true">
      <div id="print"></div>
    </div>

    <button id="camera" type="button" aria-label="Take a photo">
      <svg viewBox="0 0 320 270" aria-hidden="true">
        <defs>
          <linearGradient id="c-body" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#cfe9f7" />
            <stop offset=".5" stop-color="#a9d5ee" />
            <stop offset="1" stop-color="#8cc1e0" />
          </linearGradient>
          <linearGradient id="c-side" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff" stop-opacity=".35" />
            <stop offset=".12" stop-color="#fff" stop-opacity="0" />
            <stop offset=".86" stop-color="#1b4a74" stop-opacity="0" />
            <stop offset="1" stop-color="#1b4a74" stop-opacity=".22" />
          </linearGradient>
          <linearGradient id="c-ring" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4fafd" />
            <stop offset=".5" stop-color="#c9e3f2" />
            <stop offset="1" stop-color="#93bfdb" />
          </linearGradient>
          <linearGradient id="c-bezel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#bfe0f2" />
            <stop offset="1" stop-color="#7fb2d4" />
          </linearGradient>
          <radialGradient id="c-glass" cx=".38" cy=".32" r=".75">
            <stop offset="0" stop-color="#4a6c8c" />
            <stop offset=".45" stop-color="#16263a" />
            <stop offset="1" stop-color="#03070c" />
          </radialGradient>
          <radialGradient id="c-iris" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#2a3f5c" />
            <stop offset=".6" stop-color="#0a121c" />
            <stop offset="1" stop-color="#05080d" />
          </radialGradient>
          <pattern id="c-flashlines" width="5" height="44" patternUnits="userSpaceOnUse">
            <rect width="5" height="44" fill="#eef7fc" />
            <rect width="1.4" height="44" fill="#cfe2ee" />
          </pattern>
        </defs>

        <!-- top ridge + print slot -->
        <rect x="66" y="10" width="188" height="18" rx="7" fill="#93c4e1" />
        <rect x="76" y="15" width="168" height="5" rx="2.5" fill="#1a2b3d" />

        <!-- body -->
        <rect x="8" y="22" width="304" height="240" rx="42" fill="url(#c-body)" />
        <rect x="8" y="22" width="304" height="240" rx="42" fill="url(#c-side)" />
        <path d="M52 27 H268" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round" />
        <path d="M40 256 H280" stroke="#4f86b0" stroke-opacity=".35" stroke-width="3" stroke-linecap="round" />

        <!-- flash -->
        <rect x="30" y="44" width="80" height="46" rx="10" fill="#8dbedc" />
        <rect x="34" y="48" width="72" height="38" rx="7" fill="url(#c-flashlines)" />
        <rect id="flash-glow" x="34" y="48" width="72" height="38" rx="7" fill="#ffffff" opacity="0" />

        <!-- viewfinder -->
        <rect x="234" y="44" width="52" height="38" rx="10" fill="#8dbedc" />
        <rect x="239" y="49" width="42" height="28" rx="7" fill="#101a26" />
        <path d="M244 55 l10 0" stroke="#fff" stroke-opacity=".35" stroke-width="2.5" stroke-linecap="round" />

        <!-- lens barrel -->
        <circle cx="160" cy="152" r="88" fill="#000" opacity=".08" transform="translate(0 4)" />
        <circle cx="160" cy="152" r="86" fill="url(#c-bezel)" />

        <circle cx="160" cy="152" r="66" fill="#dcedf7" stroke="#a6cbe2" stroke-width="1.5" />
        <g stroke="#9cc3dc" stroke-width="1.2" stroke-linecap="round">
          <path d="M160 90 v5 M160 209 v5 M98 152 h5 M217 152 h5 M116 108 l3.5 3.5 M200.5 192.5 l3.5 3.5 M204 108 l-3.5 3.5 M119.5 192.5 l-3.5 3.5" />
        </g>
        <circle cx="160" cy="152" r="52" fill="#0d1520" />
        <circle cx="160" cy="152" r="46" fill="url(#c-glass)" />
        <circle cx="160" cy="152" r="24" fill="url(#c-iris)" />
        <circle cx="160" cy="152" r="24" fill="none" stroke="#5b7ea3" stroke-opacity=".35" stroke-width="1" />
        <ellipse cx="143" cy="133" rx="16" ry="9" fill="#fff" opacity=".28" transform="rotate(-35 143 133)" />
        <circle cx="178" cy="170" r="3.5" fill="#fff" opacity=".22" />

        <!-- strap lug -->
        <rect x="306" y="62" width="9" height="28" rx="3.5" fill="#7fb2d4" />

        <!-- shutter button -->
        <g id="shutter-btn">
          <circle cx="276" cy="146" r="17" fill="#7fb2d4" />
          <circle class="cap" cx="276" cy="144.5" r="13.5" fill="#f5fafd" />
          <circle class="cap" cx="276" cy="144.5" r="9" fill="#e4f0f8" />
        </g>
      </svg>
    </button>

    <div id="hint" aria-hidden="true">
      <span class="ring r1"></span>
      <span class="ring r2"></span>
      <svg class="hand" viewBox="0 0 48 48">
        <path d="M18 7.5c0-2 1.6-3.5 3.5-3.5S25 5.5 25 7.5V20l7.4 1.2c2.6.4 4.4 2.8 4.1 5.4l-1.2 9.5c-.4 3.2-3.1 5.6-6.3 5.6h-8.8c-1.9 0-3.7-.9-4.9-2.4L9 30.3c-1.1-1.4-.8-3.4.7-4.4 1.2-.8 2.8-.7 3.8.3l4.5 4.3V7.5z"
          fill="#fdfefe" stroke="#1f2f56" stroke-width="2" stroke-linejoin="round" />
      </svg>
    </div>
  </div>

  <div id="flash" aria-hidden="true"></div>

  <script type="module">
// ---- sound.js
// Instant-camera sound effects, synthesized live with the Web Audio API.
// No audio files: every click, spring, motor and gear tooth is built from
// filtered noise and oscillators, so it stays tiny and never sounds looped.

class CameraSound {
  constructor() {
    this.ctx = null;
  }

  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      const ctx = (this.ctx = new AC());

      const comp = ctx.createDynamicsCompressor();
      comp.threshold.value = -16;
      comp.ratio.value = 3.5;
      comp.attack.value = 0.002;
      comp.release.value = 0.12;
      comp.connect(ctx.destination);

      this.master = ctx.createGain();
      this.master.gain.value = 0.9;
      this.master.connect(comp);

      // small-room reverb so it sounds like a camera in your hands, not in a void
      const verb = ctx.createConvolver();
      verb.buffer = this.impulse(0.45, 3.2);
      this.wet = ctx.createGain();
      this.wet.gain.value = 0.16;
      this.wet.connect(verb).connect(comp);

      this.noiseBuf = this.makeNoise(2);
      this.gearBuf = this.makeGearTick();
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }

  // ---------------------------------------------------------------- buffers
  makeNoise(seconds) {
    const { ctx } = this;
    const buf = ctx.createBuffer(1, ctx.sampleRate * seconds, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return buf;
  }

  impulse(seconds, decay) {
    const { ctx } = this;
    const len = Math.floor(ctx.sampleRate * seconds);
    const buf = ctx.createBuffer(2, len, ctx.sampleRate);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
    }
    return buf;
  }

  // one gear tooth: a tiny resonant tick followed by silence. Looped, it becomes a gear train.
  makeGearTick() {
    const { ctx } = this;
    const period = 1 / 46; // teeth per second at playbackRate 1
    const len = Math.floor(ctx.sampleRate * period);
    const buf = ctx.createBuffer(1, len, ctx.sampleRate);
    const d = buf.getChannelData(0);
    const tickLen = Math.floor(ctx.sampleRate * 0.006);
    for (let i = 0; i < tickLen; i++) {
      const env = Math.exp(-i / (tickLen / 4));
      d[i] = (Math.random() * 2 - 1) * env * 0.9 + Math.sin(i * 0.55) * env * 0.4;
    }
    return buf;
  }

  // ---------------------------------------------------------------- primitives
  out(node, wet = true) {
    node.connect(this.master);
    if (wet) node.connect(this.wet);
  }

  burst(t, { type = 'bandpass', freq = 2000, Q = 1, gain = 0.3, attack = 0.0015, decay = 0.03, wet = true }) {
    const { ctx } = this;
    const src = ctx.createBufferSource();
    src.buffer = this.noiseBuf;
    const f = ctx.createBiquadFilter();
    f.type = type;
    f.frequency.value = freq;
    f.Q.value = Q;
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(gain, t + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t + attack + decay);
    src.connect(f).connect(g);
    this.out(g, wet);
    src.start(t, Math.random() * 1.5);
    src.stop(t + attack + decay + 0.05);
  }

  thump(t, { f0 = 140, f1 = 50, dur = 0.07, gain = 0.3 }) {
    const { ctx } = this;
    const o = ctx.createOscillator();
    o.type = 'sine';
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    this.out(g);
    o.start(t);
    o.stop(t + dur + 0.02);
  }

  // ---------------------------------------------------------------- effects
  /** The shutter: plastic button, spring-loaded blade "ka", mirror "chunk", release. */
  shutter() {
    if (!this.ensure()) return;
    const t = this.ctx.currentTime + 0.01;

    // finger on the plastic button
    this.burst(t, { freq: 3400, Q: 1.3, gain: 0.32, decay: 0.016 });
    this.burst(t, { type: 'lowpass', freq: 700, gain: 0.25, decay: 0.035 });

    // shutter blades snap: sharp transient + a ringing steel spring
    const k = t + 0.048;
    this.burst(k, { type: 'highpass', freq: 2600, gain: 0.75, decay: 0.011 });
    this.burst(k, { freq: 1780, Q: 14, gain: 0.85, decay: 0.075 });
    this.burst(k, { freq: 3950, Q: 18, gain: 0.25, decay: 0.05 });
    this.thump(k, { f0: 160, f1: 55, dur: 0.07, gain: 0.34 });

    // body "chunk" as the mechanism resets
    const c = t + 0.118;
    this.burst(c, { freq: 1150, Q: 2.2, gain: 0.45, decay: 0.032 });
    this.burst(c, { type: 'highpass', freq: 3000, gain: 0.22, decay: 0.008 });
    this.thump(c, { f0: 105, f1: 48, dur: 0.09, gain: 0.3 });

    // button springs back
    this.burst(t + 0.21, { freq: 4200, Q: 1.5, gain: 0.12, decay: 0.01 });
  }

  /** Xenon flash: a dry tick, then the rising capacitor whine as it recharges. */
  flash() {
    if (!this.ensure()) return;
    const { ctx } = this;
    const t = ctx.currentTime + 0.05;
    this.burst(t, { type: 'highpass', freq: 6500, gain: 0.09, decay: 0.05 });

    const w0 = t + 0.35;
    const dur = 2.4;
    const o = ctx.createOscillator();
    const o2 = ctx.createOscillator();
    o.type = 'sine';
    o2.type = 'triangle';
    o.frequency.setValueAtTime(2100, w0);
    o.frequency.exponentialRampToValueAtTime(7200, w0 + dur);
    o2.frequency.setValueAtTime(4200, w0);
    o2.frequency.exponentialRampToValueAtTime(14400, w0 + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, w0);
    g.gain.linearRampToValueAtTime(0.012, w0 + 0.25);
    g.gain.setValueAtTime(0.012, w0 + dur - 0.5);
    g.gain.exponentialRampToValueAtTime(0.0001, w0 + dur);
    const g2 = ctx.createGain();
    g2.gain.value = 0.25;
    o.connect(g);
    o2.connect(g2).connect(g);
    this.out(g, false);
    o.start(w0); o2.start(w0);
    o.stop(w0 + dur + 0.05); o2.stop(w0 + dur + 0.05);
  }

  /** The eject motor: spin-up, gear train, film rubbing the rollers, final clunk. */
  eject(dur = 1.55) {
    if (!this.ensure()) return;
    const { ctx } = this;
    const t = ctx.currentTime + 0.02;
    const end = t + dur;

    // relay click as the motor engages
    this.burst(t, { freq: 2300, Q: 3, gain: 0.22, decay: 0.02 });

    // motor body
    const m1 = ctx.createOscillator();
    const m2 = ctx.createOscillator();
    m1.type = 'sawtooth';
    m2.type = 'square';
    m1.frequency.setValueAtTime(70, t);
    m1.frequency.exponentialRampToValueAtTime(118, t + 0.14);
    m1.frequency.setValueAtTime(118, end - 0.18);
    m1.frequency.exponentialRampToValueAtTime(64, end);
    m2.frequency.setValueAtTime(140, t);
    m2.frequency.exponentialRampToValueAtTime(237, t + 0.14);
    m2.frequency.setValueAtTime(237, end - 0.18);
    m2.frequency.exponentialRampToValueAtTime(128, end);

    const wob = ctx.createOscillator();
    wob.frequency.value = 9;
    const wobG = ctx.createGain();
    wobG.gain.value = 2.2;
    wob.connect(wobG);
    wobG.connect(m1.frequency);
    wobG.connect(m2.frequency);

    const lp = ctx.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 1300;
    lp.Q.value = 0.9;
    const bodyRes = ctx.createBiquadFilter();
    bodyRes.type = 'peaking';
    bodyRes.frequency.value = 480;
    bodyRes.Q.value = 2;
    bodyRes.gain.value = 7;
    const m2g = ctx.createGain();
    m2g.gain.value = 0.35;
    const mg = ctx.createGain();
    mg.gain.setValueAtTime(0, t);
    mg.gain.linearRampToValueAtTime(0.13, t + 0.08);
    mg.gain.setValueAtTime(0.13, end - 0.12);
    mg.gain.linearRampToValueAtTime(0, end);
    m1.connect(lp);
    m2.connect(m2g).connect(lp);
    lp.connect(bodyRes).connect(mg);
    this.out(mg);

    // gear teeth
    const gear = ctx.createBufferSource();
    gear.buffer = this.gearBuf;
    gear.loop = true;
    gear.playbackRate.setValueAtTime(0.6, t);
    gear.playbackRate.linearRampToValueAtTime(1, t + 0.14);
    gear.playbackRate.setValueAtTime(1, end - 0.18);
    gear.playbackRate.linearRampToValueAtTime(0.55, end);
    const gbp = ctx.createBiquadFilter();
    gbp.type = 'bandpass';
    gbp.frequency.value = 2100;
    gbp.Q.value = 1.4;
    const gg = ctx.createGain();
    gg.gain.setValueAtTime(0, t);
    gg.gain.linearRampToValueAtTime(0.32, t + 0.1);
    gg.gain.setValueAtTime(0.32, end - 0.1);
    gg.gain.linearRampToValueAtTime(0, end);
    gear.connect(gbp).connect(gg);
    this.out(gg);

    // film card rubbing through the rollers
    const fr = ctx.createBufferSource();
    fr.buffer = this.noiseBuf;
    fr.loop = true;
    const fbp = ctx.createBiquadFilter();
    fbp.type = 'bandpass';
    fbp.frequency.setValueAtTime(2600, t);
    fbp.frequency.linearRampToValueAtTime(3800, end);
    fbp.Q.value = 0.7;
    const fg = ctx.createGain();
    fg.gain.setValueAtTime(0, t + 0.15);
    fg.gain.linearRampToValueAtTime(0.06, t + 0.5);
    fg.gain.setValueAtTime(0.06, end - 0.2);
    fg.gain.linearRampToValueAtTime(0, end - 0.02);
    fr.connect(fbp).connect(fg);
    this.out(fg);

    [m1, m2, wob, gear, fr].forEach((n) => { n.start(t); n.stop(end + 0.05); });

    // film drops free, motor stops
    this.burst(end - 0.02, { type: 'lowpass', freq: 900, gain: 0.32, decay: 0.05 });
    this.burst(end - 0.02, { freq: 2700, Q: 2, gain: 0.2, decay: 0.016 });
    this.thump(end - 0.02, { f0: 120, f1: 60, dur: 0.06, gain: 0.18 });
  }

  /** A print pressed onto the wall: soft paper tap and a little tape crinkle. */
  stick() {
    if (!this.ensure()) return;
    const t = this.ctx.currentTime + 0.01;
    this.burst(t, { type: 'lowpass', freq: 1100, gain: 0.3, decay: 0.035 });
    this.burst(t + 0.005, { freq: 2600, Q: 0.9, gain: 0.06, decay: 0.03 });
    this.burst(t + 0.03, { type: 'highpass', freq: 4500, gain: 0.035, attack: 0.02, decay: 0.14 });
  }
}

// ---- cards.js
// Placeholder polaroids. One per episode, eventually 100.
// Add a guest: put their photo in img/ and add { img: 'img/ep-002.jpg', frame: 'blue' } to `plan`.

function rng(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// ------------------------------------------------------------------ poems (placeholders)
const poems = [
  ['tell me', 'the part', 'you left out'],
  ['who were you', 'before', 'the pitch deck?'],
  ['a hundred', 'strangers,', 'one question'],
  ['say it slowly.', 'we have', 'all afternoon'],
];

// ------------------------------------------------------------------ the wall
// One polaroid per episode. no. 001 is the first guest; the rest are placeholders
// (your photos and short poems) until more episodes are recorded.
const plan = [
  { img: 'img/ep-001.jpg', frame: 'blue' },
  { img: 'img/ph-1.jpg', frame: 'pale' },
  { poem: 0, frame: 'blue' },
  { img: 'img/ph-2.jpg', frame: 'blue' },
  { poem: 1, frame: 'pale' },
  { img: 'img/ph-4.jpg', frame: 'blue' },
  { img: 'img/ph-5.jpg', frame: 'pale' },
  { poem: 2, frame: 'blue' },
  { img: 'img/ph-3.jpg', frame: 'pale' },
  { poem: 3, frame: 'blue' },
];

function episodes() {
  const r = rng(20261106);
  return plan.map((p, i) => ({
    ...p,
    no: i + 1,
    tilt: +((r() * 2 - 1) * 6.5).toFixed(2) || 2,
    y: +((r() * 2 - 1) * 16).toFixed(1),
    tape: +((r() * 2 - 1) * 7).toFixed(1),
  }));
}

function cardHTML(ep, { undeveloped = false } = {}) {
  const inner = ep.poem !== undefined
    ? `<div class="poem">${poems[ep.poem].map((l) => `<span>${l}</span>`).join('')}</div>`
    : `<img src="${ep.img}" alt="" draggable="false" />`;
  return `<div class="card${undeveloped ? ' undeveloped' : ''}" style="--frame:var(--frame-${ep.frame});--tape:${ep.tape}deg">
    <div class="tape"></div>
    <div class="photo">${inner}<div class="develop"></div></div>
  </div>`;
}

// ---- main.js

const NS = 'http://www.w3.org/2000/svg';
const LINES = ['Tell me', 'everything'];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

const body = document.body;
const camera = document.getElementById('camera');
const print = document.getElementById('print');
const flashEl = document.getElementById('flash');
const flashGlow = document.getElementById('flash-glow');
const track = document.getElementById('track');
const sound = new CameraSound();
const eps = episodes();

const wait = (ms) => new Promise((r) => setTimeout(r, reduced ? Math.min(ms, 60) : ms));
let state = 'intro';

// ------------------------------------------------------------------ 1. handwrite the title
async function writeTitle() {
  const svg = document.getElementById('title-svg');
  try { await document.fonts.load('100px "Special Elite"'); } catch {}

  // lay out both lines centred, then split into letters that get written one by one
  const LEAD = 104;
  const measures = LINES.map((line, n) => {
    const t = document.createElementNS(NS, 'text');
    t.setAttribute('x', '0');
    t.setAttribute('y', String(100 + n * LEAD));
    t.setAttribute('text-anchor', 'middle');
    t.setAttribute('class', 'measure');
    t.textContent = line;
    svg.appendChild(t);
    return t;
  });
  const boxes = measures.map((t) => t.getBBox());
  const x0 = Math.min(...boxes.map((b) => b.x));
  const x1 = Math.max(...boxes.map((b) => b.x + b.width));
  const y0 = boxes[0].y;
  const y1 = boxes[boxes.length - 1].y + boxes[boxes.length - 1].height;
  const pad = 14;
  svg.setAttribute('viewBox', `${x0 - pad} ${y0 - pad} ${x1 - x0 + pad * 2} ${y1 - y0 + pad * 2}`);

  const STEP = 0.1;
  let k = 0;
  measures.forEach((m, n) => {
    const line = LINES[n];
    for (let i = 0; i < line.length; i++) {
      if (line[i] === ' ') { k += 2; continue; } // the pen lifts between words
      const p = m.getStartPositionOfChar(i);
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('x', p.x);
      t.setAttribute('y', p.y);
      t.setAttribute('class', 'letter');
      t.style.setProperty('--d', `${(0.35 + k * STEP).toFixed(3)}s`);
      t.textContent = line[i];
      svg.appendChild(t);
      k++;
    }
    k += 2.5; // and moves down to the next line
  });
  measures.forEach((m) => m.remove());
  await wait((0.35 + k * STEP + 0.6) * 1000);
}

// ------------------------------------------------------------------ 2. camera rises, hint appears
async function presentCamera() {
  print.innerHTML = cardHTML(eps[0], { undeveloped: true });
  body.classList.replace('stage-intro', 'stage-ready');
  state = 'ready';
  await wait(1500);
  if (state === 'ready') body.classList.add('show-hint');
}

// ------------------------------------------------------------------ 3. shoot + print
function flash() {
  flashEl.animate(
    [{ opacity: 0 }, { opacity: 0.92, offset: 0.06 }, { opacity: 0 }],
    { duration: 820, easing: 'cubic-bezier(.2,.7,.3,1)' }
  );
  flashGlow.animate([{ opacity: 0 }, { opacity: 1, offset: 0.05 }, { opacity: 0 }], { duration: 600 });
}

function press() {
  camera.classList.add('press');
  setTimeout(() => camera.classList.remove('press'), 160);
}

async function shoot() {
  if (state === 'wall') { // the camera stays playful afterwards
    press(); sound.shutter(); sound.flash();
    setTimeout(flash, 40);
    return;
  }
  if (state !== 'ready') return;
  state = 'shooting';
  body.classList.remove('show-hint');
  body.classList.add('stage-shot');

  press();
  sound.shutter();
  sound.flash();
  setTimeout(flash, 40);
  buildWall(); // lay out the wall now, invisibly, so we know where the print will land

  await wait(420);
  sound.eject(1.55);
  print.classList.add('ejecting');
  await wait(1600);

  print.querySelector('.card').classList.add('developing');
  await wait(650);
  await flyToWall();
}

// ------------------------------------------------------------------ 4. the wall carousel
const carousel = {
  pending: 0,
  x: 0, speed: 0, target: 0, base: 34, W: 0, last: 0, running: false, slots: [],
};

function buildWall() {
  const vw = window.innerWidth;
  const one = eps.map((ep, i) =>
    `<div class="slot pending" data-i="${i}" style="--tilt:${ep.tilt}deg;--y:${ep.y}px">${cardHTML(ep)}</div>`
  ).join('');

  track.innerHTML = one + one;
  carousel.W = track.children[eps.length].offsetLeft - track.children[0].offsetLeft;
  const copies = Math.max(2, Math.ceil(vw / carousel.W) + 1);
  track.innerHTML = one.repeat(copies);
  carousel.slots = [...track.children];

  // put episode 001 at the centre of the screen
  const s0 = carousel.slots[0];
  const x0 = vw / 2 - (s0.offsetLeft + s0.offsetWidth / 2);
  carousel.x = x0 - Math.ceil(x0 / carousel.W) * carousel.W;
  applyX();
}

function applyX() {
  track.style.transform = `translate3d(${carousel.x.toFixed(2)}px,0,0)`;
}

function centreSlot() {
  const vw = window.innerWidth;
  let best = null, dist = Infinity;
  for (const s of carousel.slots) {
    if (s.dataset.i !== '0') continue;
    const d = Math.abs(s.offsetLeft + carousel.x + s.offsetWidth / 2 - vw / 2);
    if (d < dist) { dist = d; best = s; }
  }
  return best;
}

function tick(ts) {
  const dt = Math.min(0.05, (ts - (carousel.last || ts)) / 1000);
  carousel.last = ts;
  carousel.speed += (carousel.target - carousel.speed) * Math.min(1, dt * 2.2);
  // scroll / swipe / arrow keys queue up a distance that glides out smoothly
  const glide = carousel.pending * Math.min(1, dt * 7);
  carousel.pending -= glide;
  carousel.x -= carousel.speed * dt + glide;
  while (carousel.x <= -carousel.W) carousel.x += carousel.W;
  while (carousel.x > 0) carousel.x -= carousel.W;
  applyX();
  requestAnimationFrame(tick);
}

function startCarousel() {
  if (carousel.running) return;
  carousel.running = true;
  carousel.target = reduced ? 0 : carousel.base;
  requestAnimationFrame(tick);
}

// ease the whole wall down when someone is looking at a polaroid
track.addEventListener('pointerover', (e) => {
  if (e.target.closest('.slot')) carousel.target = carousel.base * 0.12;
});
track.addEventListener('pointerleave', () => {
  carousel.target = reduced ? 0 : carousel.base;
});

// ------------------------------------------------------------------ navigate the wall yourself
const MAX_QUEUE = () => window.innerWidth * 1.5;
function nudge(px) {
  if (state !== 'wall') return;
  carousel.pending = Math.max(-MAX_QUEUE(), Math.min(MAX_QUEUE(), carousel.pending + px));
}

// mouse wheel and trackpad: either scroll direction moves the wall sideways
addEventListener('wheel', (e) => {
  if (state !== 'wall') return;
  e.preventDefault();
  const unit = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? window.innerWidth : 1;
  const d = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
  nudge(d * unit * 1.1);
}, { passive: false });

// arrow keys step one polaroid at a time
addEventListener('keydown', (e) => {
  if (state !== 'wall') return;
  const step = carousel.slots[0] ? carousel.slots[1].offsetLeft - carousel.slots[0].offsetLeft : 250;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { nudge(step); e.preventDefault(); }
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { nudge(-step); e.preventDefault(); }
});

// drag or swipe the wall, with a little momentum when you let go
const wallEl = document.getElementById('wall');
let drag = null;
wallEl.addEventListener('pointerdown', (e) => {
  if (state !== 'wall') return;
  drag = { x: e.clientX, t: performance.now(), v: 0, moved: 0 };
  carousel.pending = 0;
  wallEl.setPointerCapture(e.pointerId);
});
wallEl.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const now = performance.now();
  const dx = e.clientX - drag.x;
  carousel.x += dx;
  drag.v = dx / Math.max(1, now - drag.t); // px per ms
  drag.moved += Math.abs(dx);
  drag.x = e.clientX;
  drag.t = now;
  wallEl.classList.toggle('dragging', drag.moved > 4);
});
const endDrag = () => {
  if (!drag) return;
  nudge(-drag.v * 140);
  drag = null;
  wallEl.classList.remove('dragging');
};
wallEl.addEventListener('pointerup', endDrag);
wallEl.addEventListener('pointercancel', endDrag);

async function flyToWall() {
  const target = centreSlot();
  target.classList.add('hidden');
  target.classList.remove('pending');

  const card = print.querySelector('.card');
  const from = card.getBoundingClientRect();
  const to = target.getBoundingClientRect(); // slot is unrotated; tilt lives on the card
  const tilt = parseFloat(target.style.getPropertyValue('--tilt'));

  // lift the print out of the camera into a free-floating copy
  const devNow = getComputedStyle(card.querySelector('.develop')).opacity;
  const flyer = card.cloneNode(true);
  flyer.classList.add('flyer');
  const fdev = flyer.querySelector('.develop');
  fdev.style.transition = 'none';
  fdev.style.opacity = devNow;
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fdev.style.transition = 'opacity 2.6s cubic-bezier(.5,0,.3,1)';
    fdev.style.opacity = '0';
  }));
  Object.assign(flyer.style, {
    position: 'fixed', left: `${from.left}px`, top: `${from.top}px`, margin: 0, zIndex: 30,
  });
  body.appendChild(flyer);
  print.style.visibility = 'hidden';

  body.classList.remove('stage-shot');
  body.classList.add('stage-wall');
  state = 'wall';

  // the rest of the wall gets pressed on, nearest first
  const vw = window.innerWidth;
  const others = carousel.slots
    .filter((s) => s !== target)
    .map((s) => ({ s, d: Math.abs(s.getBoundingClientRect().left + s.offsetWidth / 2 - vw / 2) }))
    .filter(({ d }) => d < vw)
    .sort((a, b) => a.d - b.d);
  others.forEach(({ s }, n) => setTimeout(() => s.classList.remove('pending'), 700 + n * 90));
  carousel.slots.forEach((s) => s !== target && !others.find((o) => o.s === s) && s.classList.remove('pending'));

  const dx = to.left - from.left;
  const dy = to.top - from.top;
  const anim = flyer.animate(
    [
      { transform: 'translate(0,0) rotate(0deg) scale(1)', boxShadow: '0 2px 4px rgba(20,30,50,.15)' },
      { transform: `translate(${dx * 0.5}px, ${dy * 0.5 - 40}px) rotate(${tilt * 0.4 - 4}deg) scale(1.08)`, boxShadow: '0 40px 50px -16px rgba(20,30,50,.35)', offset: 0.55 },
      { transform: `translate(${dx}px, ${dy}px) rotate(${tilt}deg) scale(1)`, boxShadow: '0 1px 1px rgba(20,30,50,.14), 0 10px 18px -8px rgba(20,30,50,.3)' },
    ],
    { duration: reduced ? 1 : 1500, easing: 'cubic-bezier(.45,.05,.2,1)', fill: 'forwards' }
  );
  await anim.finished;

  sound.stick();
  // carry the still-developing image over so the fade continues seamlessly
  const live = target.querySelector('.card');
  const dev = flyer.querySelector('.develop');
  const op = getComputedStyle(dev).opacity;
  const tdev = live.querySelector('.develop');
  tdev.style.opacity = op;
  tdev.style.transition = 'none';
  target.classList.remove('hidden');
  flyer.remove();
  requestAnimationFrame(() => {
    tdev.style.transition = 'opacity 2.2s cubic-bezier(.5,0,.3,1)';
    tdev.style.opacity = '0';
  });

  await wait(900);
  startCarousel();
}

// ------------------------------------------------------------------ boot
camera.addEventListener('click', shoot);

addEventListener('resize', () => {
  if (state !== 'wall') return;
  const keep = carousel.x;
  buildWall();
  carousel.slots.forEach((s) => s.classList.remove('pending'));
  carousel.x = keep % carousel.W;
  applyX();
});

(async () => {
  await writeTitle();
  await presentCamera();
})();


</script>
</body>
</html>
